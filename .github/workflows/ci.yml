name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 三平台对齐 SPEC §9 的确定性分级；但 skia 的 PNG 编码在 macOS / Linux 与
        # Windows 上字节不一致（L1 仅承诺同机 byte-identical），故 golden-frame PNG
        # 哈希门禁只在 windows-latest 真跑，其余测试三平台全覆盖。
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lottie]"
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONPATH: src
