name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 三平台对齐 SPEC §9 的确定性分级：L2 承诺覆盖 Windows / macOS，
        # 故两者都必须在矩阵内真跑 golden-frame 哈希，不能只跑 Linux。
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lottie]"
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONPATH: src
