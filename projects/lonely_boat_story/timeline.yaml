# 「孤舟渡江 · 三幕」时序层（官方故事片）
#
# 幕次（10s @30fps = 300 帧）：
#   I   落墨 0–4s     画面被**一笔一笔画出来**：月先点、远山依次勾出、水纹拉出、孤舟压轴
#                     （开场闪一次纸色 + 相机轻抖一下 = 起手）
#   II  渡江 4–7.5s   主舟横穿中景并渐渐变大；月自地平升起；群鸟横越拉出纵深；相机跟随
#                     （6.0s 切点：闪白 + 3.4px 冲击抖动）
#   III 月明 7.5–10s  主舟抵达右侧并放缓；相机顶点后回稳；雾尽灯明；收尾轻闪
#
# 通道语义（animation/track.py）：
#   translate 世界系平移增量 / rotate 绕实例锚点 / scale 绕锚点倍率 /
#   ink_shift 全实例 ink 偏移（正=变浅）/ draw 线条生长 0→1（按弧长截断几何，笔画自己画出来）
#   相机另有 shake 抖动幅度（逐帧整数哈希，一格一抖）/ flash 曝光（>0 闪纸色、<0 闪黑）
# tint 为实例级色系：石青远山、石绿水纹、朱砂孤舟、藤黄月，各自保有明暗层次。
#
# 实现要点：draw 是**场景求值期的几何截断**，不改渲染器、不改四原语、不破命门 3。
# 填充形在 draw<1 时先以轮廓呈现（勾线），画满后才落墨成面 —— 这正是水墨的作画次序。
items:
  # ── 月（藤黄）：最先点上，自地平升起 ──
  - component: moon
    iid: moon
    tint: "#E0A22B"
    overrides: {r: 26, ink: 0.86, halo: true}
    transform: {translate: [1240, 300]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 0.15, v: 0.0}
          - {t: 0.95, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 170]}
          - {t: 3.5, v: [0, 90]}
          - {t: 6.5, v: [0, 20]}
          - {t: 10.0, v: [-70, -16]}

  # ── 三重远山（石青）：依次勾出，视差左移 ──
  - component: mountain
    iid: m1
    tint: "#2E7BB5"
    overrides: {width: 300, height: 72, ink: 0.80, jag: 0.5}
    transform: {translate: [300, 372]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 0.55, v: 0.0}
          - {t: 1.95, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 10.0, v: [-90, 5]}
  - component: mountain
    iid: m2
    tint: "#2E7BB5"
    overrides: {width: 260, height: 58, ink: 0.83, jag: 0.3}
    transform: {translate: [900, 356]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 0.85, v: 0.0}
          - {t: 2.25, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 10.0, v: [-52, 3]}
  - component: mountain
    iid: m3
    tint: "#2E7BB5"
    overrides: {width: 190, height: 44, ink: 0.86, jag: 0.6}
    transform: {translate: [1380, 384]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 1.15, v: 0.0}
          - {t: 2.55, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 10.0, v: [-20, 2]}

  # ── 水纹（石绿）：自左向右逐条拉出，之后整体向左滚流 ──
  - component: water
    iid: w1
    tint: "#3FA36B"
    overrides: {width: 1000, lines: 4, amp: 4, ink: 0.24, spacing: 16}
    transform: {translate: [280, 566]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 1.30, v: 0.0}
          - {t: 2.90, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 2.5, v: [-34, 3]}
          - {t: 5.0, v: [-70, -3]}
          - {t: 7.5, v: [-104, 3]}
          - {t: 10.0, v: [-140, 0]}
  - component: water
    iid: w2
    tint: "#3FA36B"
    overrides: {width: 620, lines: 3, amp: 3, ink: 0.28, spacing: 15}
    transform: {translate: [1200, 626]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 1.60, v: 0.0}
          - {t: 3.20, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 3.0, v: [-26, 2]}
          - {t: 6.0, v: [-54, -2]}
          - {t: 10.0, v: [-90, 0]}
  - component: water
    iid: w3
    tint: "#3FA36B"
    overrides: {width: 900, lines: 3, amp: 5, ink: 0.22, spacing: 19}
    transform: {translate: [520, 744]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 1.90, v: 0.0}
          - {t: 3.50, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 2.0, v: [-40, 4]}
          - {t: 5.0, v: [-84, -4]}
          - {t: 8.0, v: [-130, 4]}
          - {t: 10.0, v: [-176, 0]}
  - component: water
    iid: w_boat
    tint: "#3FA36B"
    overrides: {width: 420, lines: 2, amp: 3, ink: 0.26, spacing: 17}
    transform: {translate: [880, 700]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 2.40, v: 0.0}
          - {t: 3.60, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 10.0, v: [-80, 0]}

  # ── 主角：孤舟（朱砂）。压轴勾出（雾里先淡、后实），横穿近整幅画布 ──
  - component: boat
    iid: boat_main
    tint: "#C8442E"
    overrides: {length: 126, beam_ratio: 0.20, hull_ink: 0.22,
                has_canopy: true, canopy_w: 0.46, canopy_h: 0.17,
                has_mast: false, has_lamp: true, tilt: -1.0}
    transform: {translate: [-120, 662]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 2.60, v: 0.0}
          - {t: 4.00, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 10]}
          - {t: 1.6, v: [210, 2]}
          - {t: 3.0, v: [400, -8]}
          - {t: 4.6, v: [620, 6]}
          - {t: 6.0, v: [790, -8]}
          - {t: 7.4, v: [950, 5]}
          - {t: 8.6, v: [1080, -5]}
          - {t: 10.0, v: [1310, 2]}
      - channel: rotate
        ease: smooth
        keys:
          - {t: 0.0, v: 0.0}
          - {t: 1.6, v: -2.0}
          - {t: 3.0, v: 2.2}
          - {t: 4.6, v: -1.8}
          - {t: 6.0, v: 2.4}
          - {t: 7.4, v: -1.6}
          - {t: 10.0, v: 0.8}
      - channel: scale
        ease: smooth
        keys:
          - {t: 0.0, v: 0.78}
          - {t: 3.0, v: 0.90}
          - {t: 6.0, v: 1.00}
          - {t: 10.0, v: 1.06}
      - channel: ink_shift
        ease: smooth
        keys:
          - {t: 0.0, v: 0.26}
          - {t: 2.2, v: 0.08}
          - {t: 4.5, v: 0.0}
          - {t: 10.0, v: 0.0}

  # ── 远岸小舟（赭石）：反向缓行，与主角形成对位 ──
  - component: boat
    iid: boat_far
    tint: "#B5652F"
    overrides: {length: 34, beam_ratio: 0.24, hull_ink: 0.52,
                has_canopy: true, has_mast: false, has_lamp: false, tilt: 0.8}
    transform: {translate: [1210, 468]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 3.20, v: 0.0}
          - {t: 4.40, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: smooth
        keys:
          - {t: 0.0, v: [0, 0]}
          - {t: 10.0, v: [-120, 6]}

  # ── 归鸟（墨青，裸原语 line）：六只 V 形，先速速勾出，再横越全画拉出纵深 ──
  - primitive: line
    iid: b1
    tint: "#1F4E6B"
    points: [[-46, -16], [0, 0], [46, -16]]
    width: 2.2
    ink: 0.16
    transform: {translate: [-140, 150]}
    anim:
      - channel: draw
        ease: smooth
        keys:
