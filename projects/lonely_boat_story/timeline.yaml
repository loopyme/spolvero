    iid: b5
    tint: "#1F4E6B"
    points: [[-44, -15], [0, 0], [44, -15]]
    width: 2.1
    ink: 0.17
    transform: {translate: [-200, 262]}
    anim:
      - channel: draw
        ease: smooth
        keys:
          - {t: 1.30, v: 0.0}
          - {t: 1.90, v: 1.0}
          - {t: 10.0, v: 1.0}
      - channel: translate
        ease: linear
        keys:
