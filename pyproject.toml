[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spolvero"
version = "0.1.0"
description = "Symbol Composition Animator — 矢量动画的确定性编译层"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "loopy" }]
keywords = ["animation", "vector", "symbolic", "deterministic", "composition"]
dependencies = [
    "skia-python==144.0.post2",
    "shapely>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
spol = "spolvero.cli:main"

[project.optional-dependencies]
lottie = ["lottie>=0.7"]
ui = ["flask>=3.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/spolvero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
