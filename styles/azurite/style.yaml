description: 青绿重彩：以石青为骨、石绿为水、朱砂与藤黄作点。颜色靠**实例级 tint** 分层——每个构件在自己的色系内做明暗（纸→淡→本色→深），而不是全片压成同一个色相。适合需要「亮起来」并承担叙事的片子；彩面积不做上限约束（本风格就是要鲜亮）。
