name: 蚀刻梦境
description: 暗底蚀刻：近黑纸面、骨色墨线、锈红点睛，叠排线/纸疤/暗角。取自《那部没拍的电影正在拍我》。
prompt: |
  本片采用「蚀刻梦境」基调——近黑纸面（不是白纸），骨色墨线（浅米白）勾形，锈红（#9B4930）作唯一的点睛色。
  叠排线制造蚀刻质感，纸疤与暗角制造旧片感；整体是暗调的、梦的、疏离的。
  禁止亮底、禁止多种鲜艳颜色、禁止干净无纹理的平涂；质感（排线/纸疤/暗角）是本片的一半。
